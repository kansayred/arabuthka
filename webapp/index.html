<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arabuthka</title>
  <link rel="stylesheet" href="style.css">
      <link rel="manifest" href="manifest.json">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <h1>🎵 Arabuthka</h1>

    <div class="upload-section">
      <label class="upload-btn">
        📁 Загрузить трек
        <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.m4a" hidden>
      </label>
      <span id="uploadStatus"></span>
    </div>
    
    <!-- ========================================== -->
    <!-- ПОИСК И СОРТИРОВКА -->
    <!-- ========================================== -->
    
    <div class="search-section">
      <!-- Поле поиска -->
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Найти трек..."
          autocomplete="off"
        >
        <button id="clearSearch" class="clear-btn" style="display: none;">✕</button>
      </div>

      <!-- Кнопки сортировки -->
      <div class="sort-buttons">
        <button id="sortByName" class="sort-btn" title="Сортировать по имени">
          🅰️ По имени
        </button>
        <button id="sortByDate" class="sort-btn active" title="Сортировать по дате">
          📅 По дате
        </button>
      </div>
    </div>

    <div class="player">
      <div class="track-info">
        <span id="trackName">Выбери трек</span>
      </div>

      <!-- Прогресс-бар -->
      <div class="progress-container">
        <span id="currentTime">0:00</span>
        <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100">
        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <button id="shuffleBtn" onclick="toggleShuffle()" title="Перемешать">🔀</button>
        <button onclick="prevTrack()" title="Предыдущий">⏮</button>
        <button id="playBtn" onclick="togglePlay()" title="Воспроизведение">▶️</button>
        <button onclick="nextTrack()" title="Следующий">⏭</button>
        <button id="repeatBtn" onclick="toggleRepeat()" title="Повтор">🔁</button>
      </div>

      <!-- Громкость -->
      <div class="volume-container">
        <button id="muteBtn" onclick="toggleMute()">🔊</button>
        <input type="range" id="volumeBar" class="volume-bar" value="100" min="0" max="100">
      </div>

      <audio id="audio"></audio>
    </div>

    <div class="track-list" id="trackList">
      <p>Загрузка...</p>
    </div>
  </div>

  <script src="app.js"></script>

      <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then((registration) => {
                        console.log('✅ Service Worker зарегистрирован:', registration.scope);
                    })
                    .catch((error) => {
                        console.error('❌ Ошибка регистрации Service Worker:', error);
                    });
            });
        } else {
            console.warn('⚠️ Service Worker не поддерживается этим браузером');
        }
    </script>
</body>
</html>
