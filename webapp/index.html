<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Арабутка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- Декоративные элементы -->
    <div class="brush-decoration brush-top"></div>
    <div class="brush-decoration brush-bottom"></div>

    <div class="container">
        <!-- Заголовок -->
        <header class="header fade-in">
            <h1 class="logo">
                <span class="logo-icon">🎵</span>Арабутка
            </h1>
        </header>

        <!-- Загрузка -->
        <div class="upload-section fade-in">
            <label class="upload-btn">
                <span>📁</span>
                Загрузить трек
                <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.m4a" hidden>
            </label>
            <span id="uploadStatus"></span>
        </div>

        <!-- Поиск и сортировка -->
        <div class="search-section fade-in">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Найти трек..." autocomplete="off">
                <button class="clear-btn" id="clearSearch">✕</button>
            </div>
            <div class="sort-buttons">
                <button class="sort-btn active" data-sort="name">🅰️ По имени</button>
                <button class="sort-btn" data-sort="date">📅 По дате</button>
            </div>
        </div>

        <!-- Плеер -->
        <div class="player-section fade-in">
            <div class="cover-art no-cover" id="coverArt"></div>
            <div class="track-info">
                <div class="track-title" id="trackTitle">Арабутка</div>
                <div class="track-artist" id="trackArtist"></div>
            </div>
            <div class="progress-container">
                <span class="time" id="currentTime">0:00</span>
                <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100">
                <span class="time" id="duration">0:00</span>
            </div>
            <div class="controls">
                <button class="control-btn" id="shuffleBtn">🔀</button>
                <button class="control-btn" id="prevBtn">⏮️</button>
                <button id="playBtn">▶️</button>
                <button class="control-btn" id="nextBtn">⏭️</button>
                <button class="control-btn" id="repeatBtn">🔁</button>
            </div>
            <div class="volume-container">
                <button id="muteBtn">🔊</button>
                <input type="range" id="volumeBar" class="volume-bar" value="100" min="0" max="100">
            </div>
            <audio id="audioPlayer"></audio>
        </div>

        <!-- Список треков -->
        <div class="track-list fade-in" id="trackList">
            <p>Загрузка...</p>
        </div>

        <!-- Глобальный поиск -->
        <div class="global-search-section fade-in">
            <h2>🌍 Поиск музыки</h2>
            <div class="global-search-box">
                <input type="text" id="globalSearchInput" placeholder="Исполнитель или трек..." autocomplete="off">
                <button id="globalSearchBtn">🔍</button>
            </div>
            <div id="globalSearchResults">
                <p>Введите запрос для поиска</p>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-tab="home">
            <span class="nav-icon">🏠</span>
            <span>Главная</span>
        </button>
        <button class="nav-item" data-tab="library">
            <span class="nav-icon">🎵</span>
            <span>Библиотека</span>
        </button>
        <button class="nav-item" data-tab="search">
            <span class="nav-icon">🔍</span>
            <span>Поиск</span>
        </button>
        <button class="nav-item" data-tab="profile">
            <span class="nav-icon">👤</span>
            <span>Профиль</span>
        </button>
    </nav>

    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="audioPlayer.js"></script>
    <script src="playerUI.js"></script>
    <script src="searchMusic.js"></script>
    <script src="mediaSession.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('SW:', reg.scope))
                    .catch(err => console.error('SW:', err));
            });
        }
    </script>
</body>
</html>
