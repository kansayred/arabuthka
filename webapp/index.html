<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Арабутка</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <h1>🎵 Арабутка</h1>

    <div class="upload-section">
      <label class="upload-btn">
        📁 Загрузить трек
        <input type="file" id="fileInput" accept=".mp3" hidden>
      </label>
      <span id="uploadStatus"></span>
    </div>

    <div class="player">
      <div class="track-info">
        <span id="trackName">Выбери трек</span>
      </div>
      <div class="controls">
        <button id="shuffleBtn" onclick="toggleShuffle()">🔀</button>
        <button onclick="prevTrack()">⏮</button>
        <button onclick="document.getElementById('audio').paused ? document.getElementById('audio').play() : document.getElementById('audio').pause()">▶️</button>
        <button onclick="nextTrack()">⏭</button>
        <button id="repeatBtn" onclick="toggleRepeat()">🔁</button>
      </div>
      <audio id="audio" controls></audio>
    </div>

    <div class="track-list" id="trackList">
      <p>Загрузка...</p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
