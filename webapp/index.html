<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Арабутка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="design-tokens.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- Decorative blobs -->
    <div class="brush-decoration brush-top"></div>
    <div class="brush-decoration brush-bottom"></div>

    <div class="container">
        <header class="header fade-in">
            <h1 class="logo">
                <i data-lucide="music" class="logo-icon-svg"></i>
                Арабутка
            </h1>
        </header>

        <!-- Upload -->
        <div class="upload-section fade-in">
            <label class="upload-btn">
                <i data-lucide="upload" style="width:18px;height:18px"></i>
                Загрузить трек
                <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.m4a" hidden>
            </label>
            <span id="uploadStatus"></span>
        </div>

        <!-- Search -->
        <div class="search-section fade-in">
            <div class="search-box">
                <i data-lucide="search" class="search-icon-svg"></i>
                <input type="text" id="searchInput" placeholder="Найти трек..." autocomplete="off">
                <button class="clear-btn" id="clearSearch">
                    <i data-lucide="x" style="width:12px;height:12px"></i>
                </button>
            </div>
            <div class="sort-buttons">
                <button class="sort-btn active" data-sort="name">
                    <i data-lucide="arrow-down-a-z" style="width:14px;height:14px"></i> По имени
                </button>
                <button class="sort-btn" data-sort="date">
                    <i data-lucide="calendar" style="width:14px;height:14px"></i> По дате
                </button>
            </div>
        </div>

        <!-- Player -->
        <div class="player-section fade-in">
            <div class="cover-art no-cover" id="coverArt"></div>
            <div class="track-info">
                <div class="track-title" id="trackTitle">Арабутка</div>
                <div class="track-artist" id="trackArtist"></div>
            </div>
            <div class="progress-container">
                <span class="time" id="currentTime">0:00</span>
                <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100">
                <span class="time" id="duration">0:00</span>
            </div>
            <div class="controls">
                <button class="control-btn" id="shuffleBtn" onclick="toggleShuffle()">
                    <i data-lucide="shuffle" style="width:18px;height:18px"></i>
                </button>
                <button class="control-btn" id="prevBtn" onclick="prevTrack()">
                    <i data-lucide="skip-back" style="width:18px;height:18px"></i>
                </button>
                <button id="playBtn" onclick="togglePlay()">
                    <i data-lucide="play" style="width:26px;height:26px"></i>
                </button>
                <button class="control-btn" id="nextBtn" onclick="nextTrack()">
                    <i data-lucide="skip-forward" style="width:18px;height:18px"></i>
                </button>
                <button class="control-btn" id="repeatBtn" onclick="toggleRepeat()">
                    <i data-lucide="repeat" style="width:18px;height:18px"></i>
                </button>
            </div>
            <div class="volume-container">
                <button id="muteBtn" onclick="toggleMute()">
                    <i data-lucide="volume-2" style="width:16px;height:16px"></i>
                </button>
                <input type="range" id="volumeBar" class="volume-bar" value="100" min="0" max="100">
            </div>
            <audio id="audioPlayer"></audio>
        </div>

        <!-- Track list -->
        <div class="track-list fade-in" id="trackList">
            <p>Загрузка...</p>
        </div>

        <!-- Global Search -->
        <div class="global-search-section fade-in">
            <h2><i data-lucide="globe" style="width:20px;height:20px;vertical-align:middle"></i> Поиск музыки</h2>
            <div class="global-search-box">
                <input type="text" id="globalSearchInput" placeholder="Исполнитель или трек..." autocomplete="off">
                <button id="globalSearchBtn">
                    <i data-lucide="search" style="width:18px;height:18px"></i>
                </button>
            </div>
            <div id="globalSearchResults">
                <p>Введите запрос для поиска</p>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-tab="home">
            <i data-lucide="home" class="nav-icon-svg"></i>
            <span>Главная</span>
        </button>
        <button class="nav-item" data-tab="library">
            <i data-lucide="library" class="nav-icon-svg"></i>
            <span>Библиотека</span>
        </button>
        <button class="nav-item" data-tab="search">
            <i data-lucide="search" class="nav-icon-svg"></i>
            <span>Поиск</span>
        </button>
        <button class="nav-item" data-tab="profile">
            <i data-lucide="user" class="nav-icon-svg"></i>
            <span>Профиль</span>
        </button>
    </nav>

    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="audioPlayer.js"></script>
    <script src="playerUI.js"></script>
    <script src="searchMusic.js"></script>
    <script type="module" src="app.js"></script>
    <script>
        // Init Lucide icons after DOM ready
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
        });
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('SW:', reg.scope))
                    .catch(err => console.error('SW:', err));
            });
        }
    </script>
</body>
</html>
