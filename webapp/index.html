<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Арабутка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="design-tokens.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="miniPlayer.css">
    <link rel="stylesheet" href="onboarding.css">
    <link rel="stylesheet" href="ui-extras.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="player.css">
    <link rel="stylesheet" href="dialogs.css">
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="tg-dark.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- Decorative blobs -->
    <div class="brush-decoration brush-top" aria-hidden="true"></div>
    <div class="brush-decoration brush-bottom" aria-hidden="true"></div>

    <div class="container">
        <header class="header fade-in" id="appHeader">
            <h1 class="logo">
                <i data-lucide="music" class="logo-icon-svg" aria-hidden="true"></i>
                Арабутка
            </h1>
        </header>

        <!-- ===== TAB: HOME ===== -->
        <div class="section-page active" data-tab="home">
            <!-- Upload -->
            <div class="upload-section fade-in">
                <label class="upload-btn" aria-label="Загрузить трек">
                    <i data-lucide="upload" style="width:18px;height:18px" aria-hidden="true"></i>
                    Загрузить трек
                    <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.m4a,.aac" hidden aria-label="Выбрать аудиофайл">
                </label>
                <span id="uploadStatus" aria-live="polite"></span>
            </div>

            <!-- Search -->
            <div class="search-section fade-in">
                <div class="search-box">
                    <i data-lucide="search" class="search-icon-svg" aria-hidden="true"></i>
                    <input type="text" id="searchInput" placeholder="Найти трек..." autocomplete="off" aria-label="Поиск по библиотеке">
                    <button class="clear-btn" id="clearSearch" aria-label="Очистить поиск">
                        <i data-lucide="x" style="width:12px;height:12px" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="sort-buttons" role="group" aria-label="Сортировка">
                    <button class="sort-btn" data-sort="name" aria-label="Сортировка по имени">
                        <i data-lucide="arrow-down-a-z" style="width:14px;height:14px" aria-hidden="true"></i> По имени
                    </button>
                    <button class="sort-btn active" data-sort="date" aria-label="Сортировка по дате">
                        <i data-lucide="calendar" style="width:14px;height:14px" aria-hidden="true"></i> По дате
                    </button>
                </div>
            </div>

            <!-- Player -->
            <div class="player-section fade-in" role="region" aria-label="Плеер">
                <div class="cover-art no-cover" id="coverArt" role="img" aria-label="Обложка трека"></div>
                <div class="track-info">
                    <div class="track-title" id="trackTitle">Арабутка</div>
                    <div class="track-artist" id="trackArtist"></div>
                </div>
                <div class="progress-container">
                    <span class="time" id="currentTime">0:00</span>
                    <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100" aria-label="Прогресс воспроизведения">
                    <span class="time" id="duration">0:00</span>
                </div>
                <div class="controls" role="group" aria-label="Управление плеером">
                    <button class="control-btn" id="shuffleBtn" onclick="toggleShuffle()" aria-label="Перемешать">
                        <i data-lucide="shuffle" style="width:18px;height:18px" aria-hidden="true"></i>
                    </button>
                    <button class="control-btn" id="prevBtn" onclick="prevTrack()" aria-label="Предыдущий трек">
                        <i data-lucide="skip-back" style="width:18px;height:18px" aria-hidden="true"></i>
                    </button>
                    <button id="playBtn" onclick="togglePlay()" aria-label="Воспроизвести">
                        <i data-lucide="play" style="width:26px;height:26px" aria-hidden="true"></i>
                    </button>
                    <button class="control-btn" id="nextBtn" onclick="nextTrack()" aria-label="Следующий трек">
                        <i data-lucide="skip-forward" style="width:18px;height:18px" aria-hidden="true"></i>
                    </button>
                    <button class="control-btn" id="repeatBtn" onclick="toggleRepeat()" aria-label="Повтор">
                        <i data-lucide="repeat" style="width:18px;height:18px" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="volume-container">
                    <button id="muteBtn" onclick="toggleMute()" aria-label="Звук">
                        <i data-lucide="volume-2" style="width:16px;height:16px" aria-hidden="true"></i>
                    </button>
                    <input type="range" id="volumeBar" class="volume-bar" value="100" min="0" max="100" aria-label="Громкость">
                </div>
                <audio id="audioPlayer"></audio>
            </div>

            <!-- Track list -->
            <div class="track-list fade-in" id="trackList" role="list" aria-label="Список треков">
                <p>Загрузка...</p>
            </div>
        </div>

        <!-- ===== TAB: LIBRARY (Playlists) ===== -->
        <div class="section-page" data-tab="library">
            <div class="playlists-section fade-in" id="playlistsSection" role="region" aria-label="Плейлисты"></div>
        </div>

        <!-- ===== TAB: SEARCH (Global) ===== -->
        <div class="section-page" data-tab="search">
            <div class="global-search-section fade-in">
                <h2><i data-lucide="globe" style="width:20px;height:20px;vertical-align:middle" aria-hidden="true"></i> Поиск музыки</h2>
                <div class="global-search-box">
                    <input type="text" id="globalSearchInput" placeholder="Исполнитель или трек..." autocomplete="off" aria-label="Глобальный поиск музыки">
                    <button id="globalSearchBtn" aria-label="Найти">
                        <i data-lucide="search" style="width:18px;height:18px" aria-hidden="true"></i>
                    </button>
                </div>
                <div id="globalSearchResults" aria-live="polite">
                    <p>Введите запрос для поиска</p>
                </div>
            </div>
        </div>

        <!-- ===== TAB: PROFILE ===== -->
        <div class="section-page" data-tab="profile">
            <div class="profile-section fade-in" id="profileSection" role="region" aria-label="Профиль">
                <div class="profile-card">
                    <div class="profile-avatar" id="profileAvatar">
                        <i data-lucide="user" style="width:40px;height:40px" aria-hidden="true"></i>
                    </div>
                    <div class="profile-name" id="profileName">—</div>
                    <div class="profile-username" id="profileUsername"></div>
                </div>
                <div class="profile-stats" id="profileStats">
                    <div class="profile-stat">
                        <div class="profile-stat-value" id="profileTrackCount">0</div>
                        <div class="profile-stat-label">треков</div>
                    </div>
                    <div class="profile-stat">
                        <div class="profile-stat-value" id="profilePlaylistCount">0</div>
                        <div class="profile-stat-label">плейлистов</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Mini Player -->
    <div class="mini-player" id="miniPlayer" role="region" aria-label="Мини-плеер">
        <div class="mini-player-cover no-cover"></div>
        <div class="mini-player-info">
            <div class="mini-player-title">Нет трека</div>
            <div class="mini-player-artist"></div>
        </div>
        <button class="mini-player-play" aria-label="Воспроизвести">
            <i data-lucide="play" style="width:18px;height:18px" aria-hidden="true"></i>
        </button>
        <div class="mini-player-progress"></div>
    </div>

    <!-- Fullscreen Player -->
    <div class="fullscreen-player" id="fullscreenPlayer" role="dialog" aria-label="Полноэкранный плеер">
        <div class="fs-close-bar"></div>
        <div class="fs-cover"></div>
        <div class="fs-info">
            <div class="fs-title">Нет трека</div>
            <div class="fs-artist"></div>
        </div>

        <!-- Fullscreen Progress -->
        <div class="fs-progress-container">
            <input type="range" id="fsProgressBar" class="fs-progress-bar" value="0" min="0" max="100" aria-label="Прогресс воспроизведения">
            <div class="fs-time-row">
                <span class="fs-time" id="fsCurrentTime">0:00</span>
                <span class="fs-time" id="fsDuration">0:00</span>
            </div>
        </div>

        <!-- Fullscreen Controls -->
        <div class="fs-controls" role="group" aria-label="Управление полноэкранным плеером">
            <button class="fs-ctrl-btn fs-shuffle-btn" id="fsShuffleBtn" aria-label="Перемешать">
                <i data-lucide="shuffle" style="width:18px;height:18px" aria-hidden="true"></i>
            </button>
            <button class="fs-ctrl-btn fs-prev-btn" id="fsPrevBtn" aria-label="Предыдущий трек">
                <i data-lucide="skip-back" style="width:22px;height:22px" aria-hidden="true"></i>
            </button>
            <button class="fs-play-btn" id="fsPlayBtn" aria-label="Воспроизвести / Пауза">
                <i data-lucide="play" style="width:28px;height:28px" aria-hidden="true"></i>
            </button>
            <button class="fs-ctrl-btn fs-next-btn" id="fsNextBtn" aria-label="Следующий трек">
                <i data-lucide="skip-forward" style="width:22px;height:22px" aria-hidden="true"></i>
            </button>
            <button class="fs-ctrl-btn fs-repeat-btn" id="fsRepeatBtn" aria-label="Повтор">
                <i data-lucide="repeat" style="width:18px;height:18px" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Playlist Dialog (custom bottom-sheet) -->
    <div class="dialog-overlay" id="playlistDialog" style="display:none" role="dialog" aria-modal="true" aria-label="Новый плейлист">
        <div class="dialog-sheet">
            <h3>Новый плейлист</h3>
            <input type="text" id="playlistNameInput" placeholder="Название..." autocomplete="off" aria-label="Название плейлиста">
            <div class="dialog-actions">
                <button class="dialog-btn dialog-cancel" id="playlistDialogCancel">Отмена</button>
                <button class="dialog-btn dialog-ok" id="playlistDialogOk">Создать</button>
            </div>
        </div>
    </div>

    <!-- Add Tracks to Playlist Dialog -->
    <div class="dialog-overlay" id="addTracksDialog" style="display:none" role="dialog" aria-modal="true" aria-label="Добавить треки">
        <div class="dialog-sheet">
            <h3>Добавить треки</h3>
            <div id="addTracksListContainer" style="max-height:50vh;overflow-y:auto;margin-bottom:16px;"></div>
            <div class="dialog-actions">
                <button class="dialog-btn dialog-cancel" id="addTracksDialogCancel">Отмена</button>
                <button class="dialog-btn dialog-ok" id="addTracksDialogOk">Добавить</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" aria-label="Основная навигация">
        <button class="nav-item active" data-tab="home" aria-label="Главная">
            <i data-lucide="home" class="nav-icon-svg" aria-hidden="true"></i>
            <span>Главная</span>
        </button>
        <button class="nav-item" data-tab="library" aria-label="Библиотека">
            <i data-lucide="library" class="nav-icon-svg" aria-hidden="true"></i>
            <span>Библиотека</span>
        </button>
        <button class="nav-item" data-tab="search" aria-label="Поиск">
            <i data-lucide="search" class="nav-icon-svg" aria-hidden="true"></i>
            <span>Поиск</span>
        </button>
        <button class="nav-item" data-tab="profile" aria-label="Профиль">
            <i data-lucide="user" class="nav-icon-svg" aria-hidden="true"></i>
            <span>Профиль</span>
        </button>
    </nav>

    <script src="config.js"></script>
    <script src="tg-theme.js"></script>
    <script src="utils.js"></script>
    <script src="network.js"></script>
    <script src="searchMusic.js"></script>
    <script src="playlists.js"></script>
    <script src="miniPlayer.js"></script>
    <script src="gradients.js"></script>
    <script src="onboarding.js"></script>
    <script type="module" src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
        });
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('SW:', reg.scope))
                    .catch(err => console.error('SW:', err));
            });
        }
    </script>
</body>
</html>
